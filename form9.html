<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background-color: #f9f9f9; }
        
        /* Formun dış kutusu */
        form { 
            max-width: 100px; 
            margin: auto; 
            background: white; 
            border: 1px solid #ddd; 
            padding: 25px; 
            border-radius: 8px; 
        }

        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }

        .row { margin-bottom: 20px; }
        
        label { font-weight: bold; display: block; margin-bottom: 5px; }

        fieldset { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        
        legend { font-weight: bold; padding: 0 10px; }

        /* Butonları büyüttüğümüz kısım kanka */
        input[type="submit"], input[type="reset"] {
            padding: 15px 35px; /* Daha geniş ve yüksek */
            font-size: 18px;    /* Yazı tipi daha büyük */
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid #bbb;
            margin-right: 10px;
            transition: 0.3s;
        }

        input[type="submit"] { background-color: #007bff; color: white; border: none; }
        input[type="submit"]:hover { background-color: #0056b3; }

        input[type="reset"] { background-color: #f1f1f1; }
        input[type="reset"]:hover { background-color: #ddd; }

        textarea { width: 100%; border: 1px solid #ccc; padding: 5px; }
        select {
        font-size: 16px; /* Yazıları biraz büyütür */
        padding: 5px;    /* Kutunun içini ferahlatır */
        }
    </style>
</head>
<body>

    <h1>Music Survey - HW9</h1>

    <!-- Sunucu Bağlantısı -->
    <form method="post" action="http://www.uyar.com/teaching/ecc006/2017spring/login.php">
        
        <div class="row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="my_name" style="width: 250px; padding: 5px;">
        </div>

        <div class="row">
            <label for="email">E-Mail:</label>
            <input type="email" id="email" name="my_email" style="width: 250px; padding: 5px;">
        </div>

        <fieldset>
            <legend>Select Your Favorite Types of Music:</legend>
            <input type="checkbox" name="m1" id="c1"> <label style="display:inline" for="c1">Pop</label><br>
            <input type="checkbox" name="m2" id="c2"> <label style="display:inline" for="c2">Classical</label><br>
            <input type="checkbox" name="m3" id="c3"> <label style="display:inline" for="c3">Rock</label><br>
            <input type="checkbox" name="m4" id="c4"> <label style="display:inline" for="c4">Folk</label><br>
            <input type="checkbox" name="m5" id="c5"> <label style="display:inline" for="c5">Rap</label><br>
            <input type="checkbox" name="m6" id="c6"> <label style="display:inline" for="c6">Other</label>
        </fieldset>

        <fieldset>
            <legend>Select how often you purchase Music CDs:</legend>
            <input type="radio" name="p" id="r1" value="w"> <label style="display:inline" for="r1">Weekly</label><br>
            <input type="radio" name="p" id="r2" value="f"> <label style="display:inline" for="r2">A few CDs each year</label><br>
            <input type="radio" name="p" id="r3" value="m"> <label style="display:inline" for="r3">Monthly</label><br>
            <input type="radio" name="p" id="r4" value="n"> <label style="display:inline" for="r4">Never purchase</label>
        </fieldset>

        <!-- Liste Çeşitlendirildi (En az 4 öğe, 3'ü görünür) -->
        <div class="row">
            <label for="loc">Select the locations you listen to Music:</label>
            <select name="location" id="loc" size="3" style="width: 260px;">
                <option value="car">At home</option>
                <option value="gym">During Travel (Bus/Plane)At the Gym </option>
                <option value="office">At work </option>
                <option value="home">At nature walk </option>
                <option value="travel">At the Gym</option>
                <option value="travel">In the car</option>
            </select>
        </div>

        <!-- Scrolling Text Box (60x3) -->
        <div class="row">
            <label for="comm">What role does music play in your life?</label>
            <textarea id="comm" name="comments" rows="3" cols="60"></textarea>
        </div>

        <!-- Büyük Butonlar -->
        <div class="row">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>
    <p><a href="index.html">← Back to Home</a></p>
</body>
</html>
